<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Notenleser</title>
  </head>
  <body>
    <header class="topbar">
      <h1>Notenleser</h1>
      <div id="midi-status" class="midi-status" role="status"></div>
    </header>

    <main class="layout">
      <section class="card staff-card">
        <div id="staff" class="staff"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
      </section>

      <section class="session" aria-label="Aktuelle Sitzung">
        <div class="metric"><span class="metric-value" id="m-correct">0</span><span class="metric-label">Richtig</span></div>
        <div class="metric"><span class="metric-value" id="m-wrong">0</span><span class="metric-label">Falsch</span></div>
        <div class="metric"><span class="metric-value" id="m-rate">–</span><span class="metric-label">Quote</span></div>
        <div class="metric"><span class="metric-value" id="m-avg">–</span><span class="metric-label">Ø Reaktion</span></div>
        <div class="metric"><span class="metric-value" id="m-last">–</span><span class="metric-label">Letzte</span></div>
      </section>

      <section class="card keyboard-card">
        <div class="keyboard-bar">
          <span>Computertastatur: Oktave <strong id="pc-octave">4</strong></span>
          <span class="keyboard-buttons">
            <button type="button" id="octave-down" title="Oktave tiefer">− Oktave</button>
            <button type="button" id="octave-up" title="Oktave höher">+ Oktave</button>
          </span>
          <span class="hint" id="octave-hint"></span>
        </div>
        <div id="keyboard" class="keyboard"></div>
      </section>

      <details class="card panel">
        <summary>Einstellungen</summary>
        <form id="settings" class="settings">
          <label>Tiefste Note <select name="rangeLow"></select></label>
          <label>Höchste Note <select name="rangeHigh"></select></label>
          <label>
            Vorzeichen
            <select name="accidentals">
              <option value="none">keine</option>
              <option value="sharps">Kreuze (♯)</option>
              <option value="flats">Bs (♭)</option>
              <option value="both">Kreuze und Bs</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" name="showNoteNames" /> Notennamen auf den Tasten</label>
          <label class="check"><input type="checkbox" name="showComputerKeys" /> Computertasten auf den Tasten</label>
          <p class="error" id="settings-error" hidden></p>
        </form>
      </details>

      <details class="card panel">
        <summary>Statistik pro Note</summary>
        <div class="table-wrap">
          <table class="stats-table">
            <thead>
              <tr><th>Note</th><th>Richtig</th><th>Falsch</th><th>Quote</th><th>Ø Zeit</th></tr>
            </thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
        <button type="button" id="reset-stats" class="danger">Statistik zurücksetzen</button>
      </details>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
